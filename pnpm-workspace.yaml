packages:
  - packages/*

allowBuilds:
  '@reown/appkit': true
  bufferutil: true
  esbuild: true
  utf-8-validate: true

catalog:
  '@eslint/js': 10.0.1
  '@netlify/functions': 6.1.1
  '@nomicfoundation/hardhat-verify': 3.1.5
  '@nomicfoundation/hardhat-viem': 3.1.0
  '@tanstack/react-query': 5.108.0
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@verax-attestation-registry/verax-sdk': 5.4.0
  '@vitejs/plugin-react': 6.3.0
  '@wagmi/core': 3.6.9
  axios: 1.21.1
  eslint: 10.15.0
  globals: 17.14.0
  hardhat: 3.22.0
  prettier: 3.10.1
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3
  typescript-eslint: 8.73.0
  viem: 2.58.0
  vite: 8.3.8
  wagmi: 3.7.11

overrides:
  # GHSA-mrwp-f3q8-3g9p: prevent custom credential disclosure on redirects.
  follow-redirects: 1.16.2
  # GHSA-mrhx-c7xc-m3w5 / CVE-2023-54404: Reown AppKit 1.8.24 still resolves
  # Zod 3.x. Zod 4.6.6 is the first patched release; retain this exact override
  # until the upstream graph publishes an explicitly compatible resolution.
  zod: 4.6.6
  '@graphql-tools/utils': 12.0.3
  axios: 1.21.1
  '@fastify/busboy': 3.2.2
  '@graphql-tools/executor-legacy-ws': 1.1.37
  http-cache-semantics: 4.3.0
  source-map-js: 1.2.2
  adm-zip@<0.6.1: 0.6.1
  brace-expansion@>=2.0.0 <2.1.7: 2.1.7
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  esbuild@>=0.27.0 <0.28.1: 0.28.1
  fast-uri@<2.4.8: 2.4.8
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  fast-uri@>=4.0.0 <4.2.3: 4.2.3
  # GHSA-4qv8-2p9j-2685 and six related advisories: keep the transitive
  # majors, but pin each to its first mature patched release.
  undici@>=4.0.0 <6.29.1: 6.29.1
  undici@>=7.0.0 <7.30.1: 7.30.1
  '@base-org/account': 2.5.13
  # GHSA-3g3m-2fjr-6pw4 / GHSA-g3hv-75wg-m249: solhint pins glob 13 (minimatch 10).
  glob@>=9.0.0 <14.0.2: 14.0.6

minimumReleaseAge: 10080
# Temporary: locked versions younger than minimumReleaseAge. Remove after 2026-11-25.
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.108.0'
  - '@tanstack/react-query@5.108.0'
  - '@testing-library/user-event@14.6.12'
  - '@tybys/wasm-util@0.10.5'
  - '@typescript-eslint/eslint-plugin@8.73.0'
  - '@typescript-eslint/parser@8.73.0'
  - '@typescript-eslint/project-service@8.73.0'
  - '@typescript-eslint/scope-manager@8.73.0'
  - '@typescript-eslint/tsconfig-utils@8.73.0'
  - '@typescript-eslint/type-utils@8.73.0'
  - '@typescript-eslint/types@8.73.0'
  - '@typescript-eslint/typescript-estree@8.73.0'
  - '@typescript-eslint/utils@8.73.0'
  - '@typescript-eslint/visitor-keys@8.73.0'
  - '@vitest/mocker@5.1.1'
  - '@vitest/spy@5.1.1'
  - 'eslint-plugin-react-refresh@0.5.8'
  - 'minimatch@11.0.9'
  - 'typescript-eslint@8.73.0'
  - 'viem@2.58.0'
  - 'vitest@5.1.1'
